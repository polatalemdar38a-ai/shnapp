<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueChat App</title>
    <!-- Telefona Ana Ekran Simgesi Ekleme (PWA Manifest ve Meta Etiketleri) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22BlueChat%22%2C%22short_name%22%3A%22BlueChat%22%2C%22start_url%22%3A%22/%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%232563eb%22%7D">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #2563eb; border-radius: 4px; }
    </style>
</head>
<body class="bg-black text-white h-screen flex justify-center items-center overflow-hidden font-sans">

    <!-- Giriş / Kayıt Ekranı -->
    <div class="w-full max-w-sm bg-gray-950 p-8 rounded-3xl shadow-2xl border border-blue-900/40" id="auth-container">
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-black shadow-lg shadow-blue-600/30 mb-3">BC</div>
            <h1 class="text-2xl font-extrabold tracking-wide text-white">BlueChat</h1>
            <p class="text-xs text-gray-400 mt-1">Telefon ana ekranına ekleyebilirsin</p>
        </div>
        
        <div class="flex mb-6 bg-gray-900 p-1 rounded-xl border border-gray-800">
            <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-2 font-bold text-xs uppercase tracking-wider rounded-lg bg-blue-600 text-white transition">Giriş</button>
            <button onclick="switchTab('register')" id="tab-register" class="flex-1 py-2 font-bold text-xs uppercase tracking-wider rounded-lg text-gray-400 transition">Kayıt</button>
        </div>

        <div id="login-form" class="space-y-4">
            <input type="text" id="login-username" placeholder="Kullanıcı adı" class="w-full px-4 py-3 bg-gray-900 border border-gray-800 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-white placeholder-gray-600">
            <input type="password" id="login-password" placeholder="Şifre" class="w-full px-4 py-3 bg-gray-900 border border-gray-800 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-white placeholder-gray-600">
            <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-blue-600/25">Giriş Yap</button>
        </div>

        <div id="register-form" class="space-y-4 hidden">
            <input type="text" id="reg-username" placeholder="Kullanıcı adı seç" class="w-full px-4 py-3 bg-gray-900 border border-gray-800 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-white placeholder-gray-600">
            <input type="password" id="reg-password" placeholder="Şifre belirle" class="w-full px-4 py-3 bg-gray-900 border border-gray-800 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-white placeholder-gray-600">
            <button onclick="register()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-blue-600/25">Kayıt Ol</button>
        </div>
        
        <p id="auth-msg" class="mt-4 text-center text-xs text-red-400 font-medium"></p>
    </div>

    <!-- Ana Sohbet Arayüzü -->
    <div id="chat-container" class="w-full max-w-5xl h-[92vh] bg-black rounded-3xl shadow-2xl border border-blue-900/30 hidden flex overflow-hidden">
        
        <!-- Sol Panel -->
        <div class="w-80 bg-gray-950 border-r border-gray-900 flex flex-col">
            <!-- Üst Bar ve İşlem Simgeleri (Arama ve Artı) -->
            <div class="p-4 border-b border-gray-900 flex justify-between items-center bg-gray-900/40">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-sm" id="profile-initial">B</div>
                    <span id="current-username" class="font-bold text-sm text-white">Kullanıcı</span>
                </div>
                <div class="flex items-center space-x-2">
                    <!-- Arama Simgesi -->
                    <button onclick="openSearchModal()" class="w-8 h-8 rounded-full bg-gray-900 hover:bg-blue-600 flex items-center justify-center text-white transition text-xs" title="Kişi Ara & Ekle">🔍</button>
                    <!-- Artı Simgesi (Grup Kurma) -->
                    <button onclick="openGroupModal()" class="w-8 h-8 rounded-full bg-gray-900 hover:bg-blue-600 flex items-center justify-center text-white transition text-sm font-bold" title="Grup Oluştur">+</button>
                    <button onclick="logout()" class="text-xs text-gray-400 hover:text-red-400 bg-gray-900 px-2.5 py-1.5 rounded-lg transition">Çıkış</button>
                </div>
            </div>

            <!-- Bildirim Alanı -->
            <div id="notification-bar" class="hidden bg-blue-600/20 border-b border-blue-500/30 px-4 py-2 flex justify-between items-center text-xs text-blue-300">
                <span id="notif-text">Yeni bildirim var!</span>
                <button onclick="closeNotif()" class="font-bold">✕</button>
            </div>

            <!-- Sohbet Listesi / DM ve Gruplar -->
            <div class="flex-1 overflow-y-auto p-2 space-y-1">
                <div class="text-[10px] font-bold text-gray-500 px-3 uppercase tracking-wider mb-1 mt-2">Özel Sohbetler & Gruplar</div>
                <div id="chats-list" class="space-y-1"></div>

                <div class="text-[10px] font-bold text-gray-500 px-3 uppercase tracking-wider mb-1 mt-4">Arşivlenenler</div>
                <div id="archived-list" class="space-y-1"></div>
            </div>
        </div>

        <!-- Sağ Ana Sohbet Alanı -->
        <div class="flex-1 flex flex-col bg-black">
            <!-- Sohbet Başlığı ve Arşivle Butonu -->
            <div class="px-6 py-4 border-b border-gray-900 bg-gray-950 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-full bg-blue-600/30 border border-blue-500 flex items-center justify-center text-blue-400 font-bold text-sm" id="chat-header-icon">💬</div>
                    <div>
                        <h3 id="active-room-title" class="font-bold text-sm text-white">Sohbet Seçin</h3>
                        <span class="text-[10px] text-gray-500" id="active-room-sub">Sol menüden bir sohbet seçin</span>
                    </div>
                </div>
                <div id="chat-actions" class="hidden flex items-center space-x-2">
                    <button onclick="archiveCurrentRoom()" class="bg-gray-900 hover:bg-gray-800 text-xs px-3 py-1.5 rounded-xl border border-gray-800 text-gray-300 transition">📂 Arşivle</button>
                </div>
            </div>

            <!-- Mesaj Listesi -->
            <ul id="messages" class="flex-1 overflow-y-auto p-6 space-y-3 bg-black text-sm"></ul>

            <!-- Mesaj Gönderme Formu -->
            <form id="chat-form" onsubmit="sendMessage(event)" class="p-4 border-t border-gray-900 bg-gray-950 flex items-center gap-3">
                <input id="m" autocomplete="off" placeholder="Mesaj yaz..." class="flex-1 px-4 py-3 bg-gray-900 border border-gray-800 rounded-2xl text-xs text-white focus:outline-none focus:border-blue-500 placeholder-gray-600" />
                <button class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-3 rounded-2xl transition text-xs uppercase tracking-wider shadow-lg shadow-blue-600/20">Gönder</button>
            </form>
        </div>
    </div>

    <!-- MODAL: Arama ve Kişi Ekleme / Onay / Takipleşme -->
    <div id="search-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex justify-center items-center z-50">
        <div class="w-full max-w-md bg-gray-950 border border-blue-900/40 p-6 rounded-3xl shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-white text-base">Kişi Ara ve Ekle</h3>
                <button onclick="closeSearchModal()" class="text-gray-400 hover:text-white font-bold">✕</button>
            </div>
            <input type="text" id="modal-search-input" oninput="performSearch()" placeholder="Kullanıcı adı ara..." class="w-full px-4 py-3 bg-gray-900 border border-gray-800 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500 mb-3">
            
            <div id="incoming-requests-section" class="mb-4">
                <h4 class="text-[11px] font-bold text-blue-400 uppercase tracking-wider mb-2">Bekleyen Arkadaşlık İstekleri</h4>
                <div id="requests-list" class="space-y-2 max-h-28 overflow-y-auto"></div>
            </div>

            <div class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">Arama Sonuçları</div>
            <div id="modal-search-results" class="space-y-2 max-h-48 overflow-y-auto"></div>
        </div>
    </div>

    <!-- MODAL: Grup Sohbeti Oluştur -->
    <div id="group-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex justify-center items-center z-50">
        <div class="w-full max-w-md bg-gray-950 border border-blue-900/40 p-6 rounded-3xl shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-white text-base">Grup Sohbeti Oluştur</h3>
                <button onclick="closeGroupModal()" class="text-gray-400 hover:text-white font-bold">✕</button>
            </div>
            <input type="text" id="group-name-input" placeholder="Grup Adı" class="w-full px-4 py-3 bg-gray-900 border border-gray-800 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500 mb-4">
            
            <h4 class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">Arkadaşlarını Seç</h4>
            <div id="group-friends-checkboxes" class="space-y-2 max-h-40 overflow-y-auto mb-4 bg-gray-900 p-3 rounded-xl border border-gray-800"></div>

            <button onclick="createGroup()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition text-xs uppercase tracking-wider">Grubu Kur</button>
        </div>
    </div>

    <script>
        let currentUser = "";
        let currentRoom = "";
        let socket;
        let friends = [];
        let following = [];
        let followers = [];
        let archived = [];

        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');
            
            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                tabLogin.className = "flex-1 py-2 font-bold text-xs uppercase tracking-wider rounded-lg bg-blue-600 text-white transition";
                tabReg.className = "flex-1 py-2 font-bold text-xs uppercase tracking-wider rounded-lg text-gray-400 transition";
            } else {
                regForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                tabReg.className = "flex-1 py-2 font-bold text-xs uppercase tracking-wider rounded-lg bg-blue-600 text-white transition";
                tabLogin.className = "flex-1 py-2 font-bold text-xs uppercase tracking-wider rounded-lg text-gray-400 transition";
            }
            document.getElementById('auth-msg').innerText = "";
        }

        async function register() {
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            const msgEl = document.getElementById('auth-msg');

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                msgEl.className = "mt-4 text-center text-xs text-green-400 font-medium";
                msgEl.innerText = "Kayıt başarılı! Giriş yapabilirsiniz.";
                switchTab('login');
            } else {
                msgEl.innerText = data.message;
            }
        }

        async function login() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const msgEl = document.getElementById('auth-msg');

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (data.success) {
                currentUser = data.username;
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('chat-container').classList.remove('hidden');
                document.getElementById('current-username').innerText = currentUser;
                document.getElementById('profile-initial').innerText = currentUser.charAt(0).toUpperCase();
                
                socket = io();
                socket.on('chat message', function(data) {
                    if (data.room === currentRoom) {
                        appendMessage(data);
                    } else {
                        showNotification(`Yeni mesaj: ${data.sender}`);
                    }
                });

                refreshData();
            } else {
                msgEl.innerText = data.message;
            }
        }

        async function refreshData() {
            const res = await fetch(`/api/profile-info?user=${currentUser}`);
            const data = await res.json();
            if (data.success) {
                friends = data.friends;
                following = data.following;
                followers = data.followers;
                
                const archRes = await fetch(`/api/archived?user=${currentUser}`);
                archived = await archRes.json();

                renderChatsList();
                renderRequests(data.requests);
            }
        }

        async function renderChatsList() {
            const listEl = document.getElementById('chats-list');
            const archEl = document.getElementById('archived-list');
            listEl.innerHTML = "";
            archEl.innerHTML = "";

            // DM'ler (Onaylanmış arkadaşlar)
            friends.forEach(f => {
                const roomName = [currentUser, f].sort().join('_');
                const isArchived = archived.includes(roomName);
                const item = createChatListItem(f, 'Özel Mesaj', roomName, '👤');
                if (isArchived) archEl.appendChild(item);
                else listEl.appendChild(item);
            });

            // Gruplar
            const groupRes = await fetch(`/api/user-groups?user=${currentUser}`);
            const groups = await groupRes.json();
            groups.forEach(g => {
                const isArchived = archived.includes(g.id);
                const item = createChatListItem(g.name, 'Grup Sohbeti', g.id, '👥');
                if (isArchived) archEl.appendChild(item);
                else listEl.appendChild(item);
            });
        }

        function createChatListItem(name, sub, roomName, icon) {
            const div = document.createElement('div');
            div.className = "p-3 rounded-2xl cursor-pointer hover:bg-gray-900 text-white flex items-center space-x-3 transition border border-transparent hover:border-gray-800";
            div.innerHTML = `
                <div class="w-10 h-10 rounded-full bg-blue-600/20 border border-blue-500/40 flex items-center justify-center font-bold text-sm text-blue-400">${icon}</div>
                <div class="flex-1 min-w-0">
                    <h4 class="text-xs font-bold truncate">${name}</h4>
                    <p class="text-[10px] text-gray-500 truncate">${sub}</p>
                </div>
            `;
            div.onclick = () => selectRoom(roomName, name);
            return div;
        }

        function selectRoom(room, name) {
            currentRoom = room;
            document.getElementById('active-room-title').innerText = name;
            document.getElementById('active-room-sub').innerText = "Sohbet aktif";
            document.getElementById('messages').innerHTML = "";
            document.getElementById('chat-actions').classList.remove('hidden');
            socket.emit('join room', room);
        }

        async function archiveCurrentRoom() {
            if (!currentRoom) return;
            await fetch('/api/archive', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser, roomId: currentRoom })
            });
            refreshData();
            document.getElementById('messages').innerHTML = "";
            document.getElementById('active-room-title').innerText = "Sohbet Seçin";
            document.getElementById('chat-actions').classList.add('hidden');
        }

        // Arama ve Arkadaş Ekleme Modalı
        function openSearchModal() {
            document.getElementById('search-modal').classList.remove('hidden');
            refreshData();
        }
        function closeSearchModal() {
            document.getElementById('search-modal').classList.add('hidden');
        }

        async function performSearch() {
            const query = document.getElementById('modal-search-input').value;
            const res = await fetch(`/api/search?q=${query}&user=${currentUser}`);
            const usersList = await res.json();
            const resultsEl = document.getElementById('modal-search-results');
            resultsEl.innerHTML = "";

            usersList.forEach(u => {
                const isFriend = friends.includes(u.username);
                const isFollowing = following.includes(u.username);
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-gray-900 px-3 py-2.5 rounded-xl text-xs text-white border border-gray-800";
                div.innerHTML = `
                    <span>@${u.username}</span>
                    <div class="flex gap-1">
                        <button onclick="toggleFollow('${u.username}')" class="bg-gray-800 hover:bg-gray-700 px-2.5 py-1 rounded-lg text-[10px] font-semibold">${isFollowing ? 'Takipten Çık' : 'Takip Et'}</button>
                        ${!isFriend ? `<button onclick="sendRequest('${u.username}')" class="bg-blue-600 hover:bg-blue-500 px-2.5 py-1 rounded-lg text-[10px] font-bold">Arkadaş Ekle</button>` : '<span class="text-green-400 font-semibold text-[10px] self-center">Arkadaşsınız</span>'}
                    </div>
                `;
                resultsEl.appendChild(div);
            });
        }

        async function sendRequest(targetUser) {
            const res = await fetch('/api/send-request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser, targetUser })
            });
            const data = await res.json();
            alert(data.success ? "Arkadaşlık isteği gönderildi!" : data.message);
        }

        async function renderRequests(reqs) {
            const reqList = document.getElementById('requests-list');
            reqList.innerHTML = "";
            if (reqs.length === 0) {
                reqList.innerHTML = `<p class="text-[10px] text-gray-500">Bekleyen istek yok.</p>`;
                return;
            }
            reqs.forEach(req => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-gray-900 px-3 py-2 rounded-xl text-xs text-white";
                div.innerHTML = `
                    <span>@${req}</span>
                    <button onclick="acceptRequest('${req}')" class="bg-green-600 hover:bg-green-500 px-3 py-1 rounded-lg text-[10px] font-bold">Onayla</button>
                `;
                reqList.appendChild(div);
            });
        }

        async function acceptRequest(requester) {
            await fetch('/api/accept-request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser, requester })
            });
            refreshData();
            openSearchModal();
        }

        async function toggleFollow(targetUser) {
            await fetch('/api/toggle-follow', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser, targetUser })
            });
            performSearch();
        }

        // Grup Kurma Modalı
        function openGroupModal() {
            document.getElementById('group-modal').classList.remove('hidden');
            const box = document.getElementById('group-friends-checkboxes');
            box.innerHTML = "";
            friends.forEach(f => {
                box.innerHTML += `
                    <label class="flex items-center space-x-2 text-xs cursor-pointer">
                        <input type="checkbox" value="${f}" class="group-member-checkbox rounded bg-gray-800 border-gray-700 text-blue-600">
                        <span>@${f}</span>
                    </label>
                `;
            });
        }
        function closeGroupModal() {
            document.getElementById('group-modal').classList.add('hidden');
        }

        async function createGroup() {
            const groupName = document.getElementById('group-name-input').value;
            const checkboxes = document.querySelectorAll('.group-member-checkbox:checked');
            const members = Array.from(checkboxes).map(cb => cb.value);

            const res = await fetch('/api/create-group', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ groupName, creator: currentUser, members })
            });
            const data = await res.json();
            if (data.success) {
                closeGroupModal();
                refreshData();
                selectRoom(data.groupId, data.groupName);
            } else {
                alert(data.message);
            }
        }

        function showNotification(text) {
            const bar = document.getElementById('notification-bar');
            document.getElementById('notif-text').innerText = text;
            bar.classList.remove('hidden');
            setTimeout(() => bar.classList.add('hidden'), 4000);
        }
        function closeNotif() {
            document.getElementById('notification-bar').classList.add('hidden');
        }

        function logout() {
            location.reload();
        }

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('m');
            if (input.value.trim() && currentRoom) {
                socket.emit('chat message', {
                    room: currentRoom,
                    sender: currentUser,
                    text: input.value
                });
                input.value = '';
            }
        }

        function appendMessage(data) {
            const item = document.createElement('li');
            const isMe = data.sender === currentUser;
            item.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
            item.innerHTML = `
                <div class="max-w-[70%] px-4 py-2.5 rounded-2xl text-xs ${isMe ? 'bg-blue-600 text-white font-medium rounded-br-xs shadow-lg shadow-blue-600/20' : 'bg-gray-900 text-gray-200 rounded-bl-xs border border-gray-800'}">
                    ${!isMe ? `<span class="block text-[10px] text-blue-400 font-bold mb-0.5">@${data.sender}</span>` : ''}
                    ${data.text}
                </div>
            `;
            document.getElementById('messages').appendChild(item);
            window.scrollTo(0, document.body.scrollHeight);
        }
    </script>
</body>
</html>
