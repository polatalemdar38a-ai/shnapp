<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.io Sohbet Uygulaması</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Socket.io Kütüphanesi -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col justify-center items-center">

    <!-- Giriş / Kayıt Konteyneri -->
    <div class="w-full max-w-md bg-white p-6 rounded-lg shadow-md" id="auth-container">
        <h2 class="text-2xl font-bold mb-4 text-center text-gray-700">Sohbet Odasına Hoş Geldiniz</h2>
        
        <!-- Sekme Butonları -->
        <div class="flex mb-4 border-b">
            <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-2 font-semibold text-blue-600 border-b-2 border-blue-600">Giriş Yap</button>
            <button onclick="switchTab('register')" id="tab-register" class="flex-1 py-2 font-semibold text-gray-400">Kayıt Ol</button>
        </div>

        <!-- Giriş Formu -->
        <div id="login-form" class="space-y-4">
            <input type="text" id="login-username" placeholder="Kullanıcı Adı" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="password" id="login-password" placeholder="Şifre" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="login()" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition">Giriş Yap</button>
        </div>

        <!-- Kayıt Formu (Başlangıçta gizli) -->
        <div id="register-form" class="space-y-4 hidden">
            <input type="text" id="reg-username" placeholder="Kullanıcı Adı Seçin" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            <input type="password" id="reg-password" placeholder="Şifre Belirleyin" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            <button onclick="register()" class="w-full bg-green-500 text-white py-2 rounded-lg hover:bg-green-600 transition">Kayıt Ol</button>
        </div>
        
        <p id="auth-msg" class="mt-4 text-center text-sm text-red-500"></p>
    </div>

    <!-- Sohbet Alanı (Giriş yapınca görünür) -->
    <div id="chat-container" class="w-full max-w-md bg-white p-6 rounded-lg shadow-md hidden flex flex-col h-[500px]">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <h3 id="welcome-user" class="font-bold text-gray-700">Sohbet Odası</h3>
            <button onclick="logout()" class="text-sm text-red-500 hover:underline">Çıkış Yap</button>
        </div>
        
        <!-- Mesaj Listesi -->
        <ul id="messages" class="flex-1 overflow-y-auto space-y-2 mb-4 border p-2 rounded-lg bg-gray-50 text-sm"></ul>

        <!-- Mesaj Gönderme Formu -->
        <form id="chat-form" onsubmit="sendMessage(event)" class="flex gap-2">
            <input id="m" autocomplete="off" placeholder="Mesajınızı yazın..." class="flex-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <button class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">Gönder</button>
        </form>
    </div>

    <script>
        let currentUser = "";
        let socket;

        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');
            
            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                tabLogin.className = "flex-1 py-2 font-semibold text-blue-600 border-b-2 border-blue-600";
                tabReg.className = "flex-1 py-2 font-semibold text-gray-400";
            } else {
                regForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                tabReg.className = "flex-1 py-2 font-semibold text-green-600 border-b-2 border-green-600";
                tabLogin.className = "flex-1 py-2 font-semibold text-gray-400";
            }
            document.getElementById('auth-msginnerText = "";
        }

        async function register() {
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            const msgEl = document.getElementById('auth-msg');

            if(!username || !password) {
                msgEl.innerText = "Lütfen tüm alanları doldurun!";
                return;
            }

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            
            if (data.success) {
                msgEl.className = "mt-4 text-center text-sm text-green-500";
                msgEl.innerText = "Kayıt başarılı! Şimdi giriş yapabilirsiniz.";
                switchTab('login');
            } else {
                msgEl.className = "mt-4 text-center text-sm text-red-500";
                msgEl.innerText = data.message;
            }
        }

        async function login() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const msgEl = document.getElementById('auth-msg');

            if(!username || !password) {
                msgEl.innerText = "Lütfen tüm alanları doldurun!";
                return;
            }

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (data.success) {
                currentUser = username;
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('chat-container').classList.remove('hidden');
                document.getElementById('welcome-user').innerText = `Hoş geldin, ${username}`;
                
                // Socket bağlantısını başlat
                socket = io();
                socket.on('chat message', function(msg) {
                    const item = document.createElement('li');
                    item.textContent = msg;
                    item.className = "bg-white p-2 rounded shadow-sm border";
                    document.getElementById('messages').appendChild(item);
                    window.scrollTo(0, document.body.scrollHeight);
                });
            } else {
                msgEl.className = "mt-4 text-center text-sm text-red-500";
                msgEl.innerText = data.message;
            }
        }

        function logout() {
            currentUser = "";
            if (socket) socket.disconnect();
            document.getElementById('chat-container').classList.add('hidden');
            document.getElementById('auth-container').classList.remove('hidden');
            document.getElementById('messages').innerHTML = "";
        }

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('m');
            if (input.value) {
                socket.emit('chat message', `${currentUser}: ${input.value}`);
                input.value = '';
            }
        }
    </script>
</body>
</html>
