<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapChat Tarzı Sohbet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* Snapchat benzeri özel scrollbar ve koyu stil iyileştirmeleri */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4B5563; }
    </style>
</head>
<body class="bg-black text-white h-screen flex justify-center items-center overflow-hidden font-sans">

    <!-- Giriş / Kayıt Ekranı -->
    <div class="w-full max-w-sm bg-gray-900 p-8 rounded-3xl shadow-2xl border border-gray-800" id="auth-container">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-black tracking-wider text-yellow-400">SNAPCHAT</h1>
            <p class="text-xs text-gray-400 mt-1">Arkadaşlarınla anında mesajlaş</p>
        </div>
        
        <div class="flex mb-6 bg-gray-800 p-1 rounded-xl">
            <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-2 font-bold text-xs uppercase tracking-wider rounded-lg bg-yellow-400 text-black transition">Giriş</button>
            <button onclick="switchTab('register')" id="tab-register" class="flex-1 py-2 font-bold text-xs uppercase tracking-wider rounded-lg text-gray-400 transition">Kayıt</button>
        </div>

        <div id="login-form" class="space-y-4">
            <input type="text" id="login-username" placeholder="Kullanıcı adı" class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-sm focus:outline-none focus:border-yellow-400 text-white placeholder-gray-500">
            <input type="password" id="login-password" placeholder="Şifre" class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-sm focus:outline-none focus:border-yellow-400 text-white placeholder-gray-500">
            <button onclick="login()" class="w-full bg-yellow-400 hover:bg-yellow-500 text-black font-bold py-3 rounded-xl transition shadow-lg shadow-yellow-400/10">Giriş Yap</button>
        </div>

        <div id="register-form" class="space-y-4 hidden">
            <input type="text" id="reg-username" placeholder="Kullanıcı adı seç" class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-sm focus:outline-none focus:border-yellow-400 text-white placeholder-gray-500">
            <input type="password" id="reg-password" placeholder="Şifre belirle" class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-sm focus:outline-none focus:border-yellow-400 text-white placeholder-gray-500">
            <button onclick="register()" class="w-full bg-yellow-400 hover:bg-yellow-500 text-black font-bold py-3 rounded-xl transition shadow-lg shadow-yellow-400/10">Kayıt Ol</button>
        </div>
        
        <p id="auth-msg" class="mt-4 text-center text-xs text-red-400 font-medium"></p>
    </div>

    <!-- Snapchat Sohbet Arayüzü (Sidebar + Chat Alanı) -->
    <div id="chat-container" class="w-full max-w-5xl h-[92vh] bg-gray-950 rounded-3xl shadow-2xl border border-gray-800 hidden flex overflow-hidden">
        
        <!-- SOL PANEL: Profil, Arama ve Sohbet Akışı / Arkadaşlar -->
        <div class="w-80 bg-gray-900 border-r border-gray-800 flex flex-col">
            <!-- Üst Profil ve Çıkış -->
            <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-900/50">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-yellow-400 flex items-center justify-center text-black font-black text-lg" id="profile-initial">S</div>
                    <div>
                        <span id="current-username" class="font-bold text-sm block leading-tight text-white">Kullanıcı</span>
                        <span class="text-[10px] text-green-400 font-semibold flex items-center gap-1">● Çevrimiçi</span>
                    </div>
                </div>
                <button onclick="logout()" class="text-xs text-gray-400 hover:text-red-400 bg-gray-800 hover:bg-gray-700 px-2.5 py-1.5 rounded-lg transition">Çıkış</button>
            </div>

            <!-- Snapchat Tarzı Arama Çubuğu -->
            <div class="p-3 border-b border-gray-800 bg-gray-900">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">🔍</span>
                    <input type="text" id="search-input" oninput="searchUsers()" placeholder="Arkadaşlar veya yeni kişiler ara..." class="w-full pl-9 pr-3 py-2 bg-gray-800 border border-gray-700 rounded-xl text-xs text-white focus:outline-none focus:border-yellow-400 placeholder-gray-500">
                </div>
                <!-- Arama Sonuçları Açılır Kutusu -->
                <div id="search-results" class="mt-2 space-y-1 max-h-40 overflow-y-auto"></div>
            </div>

            <!-- Sohbetler ve Arkadaşlar Listesi -->
            <div class="flex-1 overflow-y-auto p-2 space-y-1">
                <div class="text-[10px] font-bold text-gray-500 px-3 uppercase tracking-wider mb-1 mt-2">Sohbetler</div>
                
                <!-- Genel Grup Öğe Kartı -->
                <div onclick="selectRoom('Genel Grup')" id="room-Genel Grup" class="p-3 rounded-2xl cursor-pointer bg-gray-800/80 text-white flex items-center space-x-3 transition group hover:bg-gray-800">
                    <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center text-lg font-bold">💬</div>
                    <div class="flex-1 min-w-0">
                        <h4 class="text-xs font-bold truncate">Genel Grup Sohbeti</h4>
                        <p class="text-[11px] text-gray-400 truncate">Herkese açık oda</p>
                    </div>
                </div>

                <!-- Dinamik Arkadaş/DM Listesi -->
                <div id="friends-list" class="space-y-1 mt-1"></div>
            </div>
        </div>

        <!-- SAĞ PANEL: Aktif Sohbet Alanı -->
        <div class="flex-1 flex flex-col bg-black">
            <!-- Sohbet Başlığı -->
            <div class="px-6 py-4 border-b border-gray-900 bg-gray-950 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-full bg-gray-800 flex items-center justify-center text-yellow-400 font-bold text-sm" id="chat-header-icon">💬</div>
                    <div>
                        <h3 id="active-room-title" class="font-bold text-sm text-white">Genel Grup Sohbeti</h3>
                        <span class="text-[10px] text-gray-500" id="active-room-sub">Sohbet odası aktif</span>
                    </div>
                </div>
            </div>

            <!-- Mesaj Listesi -->
            <ul id="messages" class="flex-1 overflow-y-auto p-6 space-y-3 bg-black text-sm"></ul>

            <!-- Mesaj Gönderme Formu -->
            <form id="chat-form" onsubmit="sendMessage(event)" class="p-4 border-t border-gray-900 bg-gray-950 flex items-center gap-3">
                <input id="m" autocomplete="off" placeholder="Mesaj gönder..." class="flex-1 px-4 py-3 bg-gray-900 border border-gray-800 rounded-2xl text-xs text-white focus:outline-none focus:border-yellow-400 placeholder-gray-500" />
                <button class="bg-yellow-400 hover:bg-yellow-500 text-black font-bold px-5 py-3 rounded-2xl transition text-xs uppercase tracking-wider shadow-lg shadow-yellow-400/10">Gönder</button>
            </form>
        </div>
    </div>

    <script>
        let currentUser = "";
        let currentRoom = "Genel Grup";
        let socket;
        let friends = [];

        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');
            
            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                tabLogin.className = "flex-1 py-2 font-bold text-xs uppercase tracking-wider rounded-lg bg-yellow-400 text-black transition";
                tabReg.className = "flex-1 py-2 font-bold text-xs uppercase tracking-wider rounded-lg text-gray-400 transition";
            } else {
                regForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                tabReg.className = "flex-1 py-2 font-bold text-xs uppercase tracking-wider rounded-lg bg-yellow-400 text-black transition";
                tabLogin.className = "flex-1 py-2 font-bold text-xs uppercase tracking-wider rounded-lg text-gray-400 transition";
            }
            document.getElementById('auth-msg').innerText = "";
        }

        async function register() {
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            const msgEl = document.getElementById('auth-msg');

            if(!username || !password) {
                msgEl.innerText = "Lütfen alanları doldurun!";
                return;
            }

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                msgEl.className = "mt-4 text-center text-xs text-green-400 font-medium";
                msgEl.innerText = "Kayıt başarılı! Giriş yapabilirsiniz.";
                switchTab('login');
            } else {
                msgEl.className = "mt-4 text-center text-xs text-red-400 font-medium";
                msgEl.innerText = data.message;
            }
        }

        async function login() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const msgEl = document.getElementById('auth-msg');

            if(!username || !password) {
                msgEl.innerText = "Lütfen alanları doldurun!";
                return;
            }

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (data.success) {
                currentUser = data.username;
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('chat-container').classList.remove('hidden');
                document.getElementById('current-username').innerText = currentUser;
                document.getElementById('profile-initial').innerText = currentUser.charAt(0).toUpperCase();
                
                socket = io();
                selectRoom('Genel Grup');

                socket.on('chat message', function(data) {
                    if (data.room === currentRoom) {
                        const item = document.createElement('li');
                        const isMe = data.sender === currentUser;
                        item.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                        item.innerHTML = `
                            <div class="max-w-[70%] px-4 py-2.5 rounded-2xl text-xs ${isMe ? 'bg-yellow-400 text-black font-medium rounded-br-xs' : 'bg-gray-800 text-white rounded-bl-xs'}">
                                ${!isMe ? `<span class="block text-[10px] text-yellow-400 font-bold mb-0.5">@${data.sender}</span>` : ''}
                                ${data.text}
                            </div>
                        `;
                        document.getElementById('messages').appendChild(item);
                        window.scrollTo(0, document.body.scrollHeight);
                    }
                });

                loadFriends();
            } else {
                msgEl.innerText = data.message;
            }
        }

        async function searchUsers() {
            const query = document.getElementById('search-input').value;
            const resultsEl = document.getElementById('search-results');
            if (!query) {
                resultsEl.innerHTML = "";
                return;
            }

            const res = await fetch(`/api/search?q=${query}&user=${currentUser}`);
            const usersList = await res.json();

            resultsEl.innerHTML = "";
            usersList.forEach(u => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-gray-800 px-3 py-2 rounded-xl text-xs text-white";
                div.innerHTML = `<span>@${u.username}</span> <button onclick="addFriend('${u.username}')" class="bg-yellow-400 hover:bg-yellow-500 text-black font-bold px-2.5 py-1 rounded-lg">Ekle</button>`;
                resultsEl.appendChild(div);
            });
        }

        async function addFriend(friendName) {
            const res = await fetch('/api/add-friend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser, friendName })
            });
            const data = await res.json();
            if (data.success) {
                loadFriends();
                document.getElementById('search-input').value = "";
                document.getElementById('search-results').innerHTML = "";
            } else {
                alert(data.message);
            }
        }

        async function loadFriends() {
            const res = await fetch(`/api/friends?user=${currentUser}`);
            const data = await res.json();
            if (data.success) {
                friends = data.friends;
                const listEl = document.getElementById('friends-list');
                listEl.innerHTML = "";
                friends.forEach(f => {
                    const roomName = [currentUser, f].sort().join('_');
                    const div = document.createElement('div');
                    div.id = `room-${roomName}`;
                    div.className = "p-3 rounded-2xl cursor-pointer hover:bg-gray-950 text-white flex items-center space-x-3 transition";
                    div.innerHTML = `
                        <div class="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center font-bold text-sm text-yellow-400">${f.charAt(0).toUpperCase()}</div>
                        <div class="flex-1 min-w-0">
                            <h4 class="text-xs font-bold truncate">@${f}</h4>
                            <p class="text-[10px] text-gray-500 truncate">Özel Mesaj (DM)</p>
                        </div>
                    `;
                    div.onclick = () => selectRoom(roomName, f);
                    listEl.appendChild(div);
                });
            }
        }

        function selectRoom(room, displayName = "Genel Grup") {
            currentRoom = room;
            const isGroup = room === 'Genel Grup';
            document.getElementById('active-room-title').innerText = isGroup ? 'Genel Grup Sohbeti' : `@${displayName}`;
            document.getElementById('active-room-sub').innerText = isGroup ? 'Herkese açık oda' : 'Birebir özel sohbet';
            document.getElementById('chat-header-icon').innerText = isGroup ? '💬' : displayName.charAt(0).toUpperCase();
            document.getElementById('messages').innerHTML = "";
            if(socket) socket.emit('join room', room);
        }

        function logout() {
            location.reload();
        }

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('m');
            if (input.value.trim()) {
                socket.emit('chat message', {
                    room: currentRoom,
                    sender: currentUser,
                    text: input.value
                });
                input.value = '';
            }
        }
    </script>
</body>
</html>
